name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run ui:tauri
      - run: node node_modules/@tauri-apps/cli/tauri.js icon assets/Pinway.png --output .toolchain/icons
      - run: mkdir -p .toolchain/release-runtime .toolchain/legal
      - run: cargo test --locked -p pinway-ide
      - run: node --test tests/*.test.mjs
      - run: c++ -std=c++17 tests/touch-button.cpp -o /tmp/pinway-touch-button && /tmp/pinway-touch-button
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: python scripts/package-desktop.py
        env:
          PINWAY_TAURI_OUT: dist/windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: pinway-windows-x64
          path: |
            dist/windows-release/*.exe
            dist/windows-release/pinway-release.json
          if-no-files-found: error
  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test firmware container
        run: |
          docker build -t pinway-cli .
          docker run --rm pinway-cli version
          mkdir -p /tmp/PinwaySmoke
          printf 'void setup() {}\nvoid loop() {}\n' > /tmp/PinwaySmoke/PinwaySmoke.ino
          docker run --rm -v /tmp/PinwaySmoke:/workspace/PinwaySmoke pinway-cli compile --fqbn arduino:avr:uno /workspace/PinwaySmoke
      - name: Export Docker image
        run: docker save pinway-cli | gzip > pinway-cli-docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pinway-docker-image
          path: pinway-cli-docker.tar.gz
          compression-level: 0
      - name: Publish CLI image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          version=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          docker tag pinway-cli "ghcr.io/$owner/pinway-cli:$version"
          docker push "ghcr.io/$owner/pinway-cli:$version"
