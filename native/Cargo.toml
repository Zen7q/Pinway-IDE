[package]
name = "pinway-native"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = { version = "0.31", features = ["syntect"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
regex = "1"
command-group = "5"
directories = "6"
