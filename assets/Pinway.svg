<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#08261c"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.7" fill="#8fe0b8" opacity="0.28"/>
    </pattern>
    <radialGradient id="dotfade" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="512" height="512" fill="url(#dotfade)"/>
    </mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wclip">
      <rect x="0" y="223.5" width="512" height="122"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#dots)" mask="url(#dotmask)"/>

  <g transform="translate(-42.58,0)" filter="url(#glow)">
    <!-- letter P: same construction as the B (stem + upper bowl), stem ends in a pin -->
    <g fill="none" stroke="#f2fbf6" stroke-width="35" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M160 149.5 V307"/>
      <path d="M160 167 H214 A40 40 0 0 1 214 247 H160"/>
    </g>
    <!-- letter w: four straight strokes, flat top and bottom (clipped) -->
    <g clip-path="url(#wclip)">
      <path fill="none" stroke="#f2fbf6" stroke-width="28" stroke-linejoin="miter" stroke-miterlimit="12" stroke-linecap="butt"
            d="M290.18 189.9 L336.1 345.5 L372.1 223.5 L408.1 345.5 L432.92 261.39"/>
    </g>
    <!-- pins -->
    <g fill="none" stroke="#86e8b2" stroke-width="9">
      <circle cx="160" cy="322" r="19"/>
      <circle cx="437.16" cy="247" r="19"/>
    </g>
    <g fill="#86e8b2">
      <circle cx="160" cy="322" r="6"/>
      <circle cx="437.16" cy="247" r="6"/>
    </g>
  </g>
</svg>
